<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-before-3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#edf2f4" />
    </linearGradient>
    <linearGradient id="tooth-grad-before3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="85%" stop-color="#f1f5f5" />
      <stop offset="100%" stop-color="#dce5e5" />
    </linearGradient>
    <filter id="shadow-crowd-before" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#005A60" flood-opacity="0.1" />
    </filter>
  </defs>

  <rect width="400" height="300" fill="url(#bg-before-3)" />

  <!-- Midline and Irregular Arch Guide -->
  <line x1="200" y1="30" x2="200" y2="240" stroke="#007B7F" stroke-opacity="0.18" stroke-width="1.2" stroke-dasharray="4 4" />
  <path d="M 60 175 Q 200 135 340 175" fill="none" stroke="#007B7F" stroke-opacity="0.25" stroke-width="1.5" stroke-dasharray="4 4" />

  <!-- Arch Base / Gum Contour -->
  <path d="M 75 142 C 110 88, 290 88, 325 142 C 310 132, 270 102, 200 102 C 130 102, 90 132, 75 142 Z" fill="#e8b9b5" fill-opacity="0.32" />

  <!-- Teeth Group: Crowding / Rotation (Right Lateral overlapping Central, Central tilted) -->
  <g filter="url(#shadow-crowd-before)">
    <!-- Right Posterior -->
    <path d="M 80 152 C 80 132, 102 130, 106 150 C 108 162, 82 165, 80 152 Z" fill="url(#tooth-grad-before3)" stroke="#9cb5b5" stroke-width="1.2" />
    <path d="M 108 144 C 110 120, 134 118, 140 142 C 142 160, 110 162, 108 144 Z" fill="url(#tooth-grad-before3)" stroke="#9cb5b5" stroke-width="1.2" />
    
    <!-- Right Central Incisor (Tilted, pushed slightly lingually) -->
    <rect x="171" y="112" width="25" height="46" rx="6" fill="url(#tooth-grad-before3)" stroke="#b5735f" stroke-width="1.4" transform="rotate(-9 183 135)" />

    <!-- Right Lateral Incisor (Rotated and overlapping central incisor) -->
    <rect x="150" y="108" width="22" height="38" rx="6" fill="url(#tooth-grad-before3)" stroke="#b5735f" stroke-width="1.6" transform="rotate(14 161 127)" />

    <!-- Left Central Incisor (Slightly rotated overlapping midline) -->
    <rect x="195" y="106" width="25" height="47" rx="6" fill="url(#tooth-grad-before3)" stroke="#b5735f" stroke-width="1.4" transform="rotate(2 207 129)" />

    <!-- Left Lateral Incisor (Inward displacement) -->
    <rect x="228" y="116" width="23" height="37" rx="6" fill="url(#tooth-grad-before3)" stroke="#9cb5b5" stroke-width="1.2" transform="rotate(-8 239 134)" />

    <!-- Left Posterior -->
    <path d="M 260 142 C 266 118, 290 120, 292 144 C 290 162, 258 160, 260 142 Z" fill="url(#tooth-grad-before3)" stroke="#9cb5b5" stroke-width="1.2" />
    <path d="M 294 150 C 298 130, 320 132, 320 152 C 318 165, 292 162, 294 150 Z" fill="url(#tooth-grad-before3)" stroke="#9cb5b5" stroke-width="1.2" />
  </g>

  <!-- Overlap indicator callout -->
  <g>
    <path d="M 166 100 L 176 100" stroke="#b5735f" stroke-width="2" />
    <text x="200" y="186" text-anchor="middle" fill="#697f80" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" letter-spacing="0.04em">ANTERIOR OVERLAP</text>
  </g>

  <!-- Clinical Case Tag -->
  <g transform="translate(20, 258)">
    <rect width="138" height="22" rx="4" fill="#ffffff" fill-opacity="0.85" stroke="#d2e0e0" stroke-width="1" />
    <text x="69" y="15" text-anchor="middle" fill="#5a7071" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="600" letter-spacing="0.03em">CASE 03 · PRE-TREATMENT</text>
  </g>
</svg>
